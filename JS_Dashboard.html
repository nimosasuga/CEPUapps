// [SMART HYBRID TOGGLE ENGINE]
function sysToggleMainSidebar() {
    const sidebar = document.getElementById('nav-sidebar');
    const overlay = document.getElementById('nav-overlay');
    
    if (window.innerWidth < 1024) {
        // Logika Mobile: Buka/Tutup Sidebar penuh (Sliding & Overlay)
        SysState.ui.sidebarOpen = !SysState.ui.sidebarOpen;
        sidebar.classList.toggle('-translate-x-full');
        overlay.classList.toggle('opacity-0');
        overlay.classList.toggle('pointer-events-none');
    } else {
        // Logika Desktop: Animasi Smooth Minimize ke ukuran Ikon
        sidebar.classList.toggle('sidebar-minimized');
        // Simpan status agar saat pindah menu tetap mengecil
        SysState.ui.sidebarMinimized = sidebar.classList.contains('sidebar-minimized');
    }
}

// ==========================================================
// [NEW ENGINE] SISTEM NAVIGASI & MANAJER MENU AKTIF
// ==========================================================

function sysNavigateTo(workspaceFunc, activeId) {
    // 1. Auto-Tutup sidebar jika digunakan di layar HP
    if (window.innerWidth < 1024 && SysState.ui.sidebarOpen) {
        sysToggleMainSidebar(); // <-- Gunakan Fungsi Baru
    }
    
    // 2. Eksekusi fungsi perubahan halaman
    if(typeof workspaceFunc === 'function') workspaceFunc();

    // 3. Modifikasi warna menu (Active State Manager)
    sysUpdateActiveMenu(activeId);
}

function sysUpdateActiveMenu(activeId) {
  const menuIds = ['menu-dinas', 'menu-log-pribadi', 'menu-cetak-deklarasi', 'menu-master', 'menu-karyawan', 'menu-live-tracking', 'menu-approval', 'menu-rekap'];

    menuIds.forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;

        const iconEl = el.querySelector('i');

        if (id === activeId) {
            // Berikan warna Gradasi Biru Bercahaya untuk Menu yang Aktif
            el.className = 'sys-menu-item flex items-center gap-4 px-6 py-4 mx-4 rounded-2xl font-bold bg-gradient-to-r from-indigo-600 to-blue-600 text-white shadow-lg shadow-indigo-500/30 cursor-pointer transition-transform hover:-translate-y-1 mt-2';
            if (iconEl) iconEl.classList.remove('text-slate-400', 'group-hover:text-indigo-500', 'transition-colors');
        } else {
            // Berikan warna transparan untuk Menu yang tidak aktif
            el.className = 'sys-menu-item flex items-center gap-4 px-6 py-3.5 mx-4 rounded-2xl font-semibold text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 cursor-pointer mt-2 transition-all group border border-transparent hover:border-indigo-100';
            if (iconEl) iconEl.classList.add('text-slate-400', 'group-hover:text-indigo-500', 'transition-colors');
        }
    });
}

function renderWorkspace_Dinas() {
    DOM_Engine.clear('nav-workspace');
    const container = document.getElementById('nav-workspace');

    if (SysState.dinas.isActive) {
        container.appendChild(buildCard_ActiveDinas());
        SysState.dinas.isLocValid = false; 
        SysState.dinas.isBarcodeValid = false;
        action_getGPS('dinas-txt-gps-pulang', 'dinas-icn-gps-pulang');
    } else {
        container.appendChild(DOM_Engine.create('div', 'flex flex-col items-center py-12', {}, [
            DOM_Engine.create('i', 'fa-solid fa-circle-notch fa-spin text-3xl text-blue-600 mb-4'),
            DOM_Engine.create('p', 'text-slate-500 font-medium', {}, ['Mempersiapkan Form & Riwayat...'])
        ]));

        google.script.run
            .withSuccessHandler((res) => {
                DOM_Engine.clear('nav-workspace');
                if (res.status === "success") {
                    
                    // [UPDATE KILLER FIX]: Deteksi Active Trip Langsung dari Server!
                    if (res.data.activeTrip) {
                        SysState.dinas.isActive = true;
                        SysState.dinas.data = res.data.activeTrip;
                        localStorage.setItem('cepu_dinas_state', JSON.stringify(res.data.activeTrip));
                        renderWorkspace_Dinas(); // Putar balik render menjadi Mode Aktif
                        return;
                    }

                    const userRole = SysState.user.jabatan.toUpperCase();
                    const userLoc = SysState.user.lokasi.toUpperCase();
                    
                    if (userRole === 'SALES' || userLoc === 'SALES') {
                        container.appendChild(buildForm_Sales(res.data));
                    } else {
                        container.appendChild(buildForm_NewDinas(res.data));
                    }
                    
                    action_getGPS('dinas-txt-gps', 'dinas-icn-gps');
                } else {
                    sysShowToast("Gagal memuat data: " + res.message, "error");
                }
            })
            .api_getInitFormData(SysState.user); 
    }
}

function checkEligibility_Berangkat() {
    const btn = document.getElementById('dinas-btn-submit');
    if (btn && SysState.dinas.isLocValid && SysState.dinas.isBarcodeValid) {
        btn.removeAttribute('disabled'); btn.classList.remove('opacity-50', 'cursor-not-allowed');
    }
}

function checkEligibility_Pulang() {
    const btn = document.getElementById('dinas-btn-pulang');
    // [UPDATE] Tambahan cek isBarcodeValid
    if (btn && SysState.dinas.isLocValid && SysState.dinas.isBarcodeValid) {
        btn.removeAttribute('disabled'); btn.classList.remove('opacity-50', 'cursor-not-allowed');
    }
}

function action_getGPS(textId, iconId) {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                SysState.dinas.kordinat = `${pos.coords.latitude}, ${pos.coords.longitude}`;
                SysState.dinas.isLocValid = true;
                const txtGps = document.getElementById(textId);
                if(txtGps) {
                    txtGps.textContent = `Akurasi: ${pos.coords.accuracy.toFixed(1)}m`;
                    txtGps.className = 'text-sm font-semibold text-emerald-600';
                    document.getElementById(iconId).className = "fa-solid fa-location-dot text-emerald-500 text-lg";
                }
                if(SysState.dinas.isActive) checkEligibility_Pulang(); else checkEligibility_Berangkat();
            },
            (err) => { 
                // [UX FIX]: Cegah Loading Abadi
                sysShowToast("GPS gagal/timeout. Pastikan GPS aktif dan Anda di area terbuka.", "error"); 
                const txtGps = document.getElementById(textId);
                if(txtGps) {
                    txtGps.textContent = "Gagal Mengunci GPS";
                    txtGps.className = 'text-sm font-semibold text-rose-500';
                    document.getElementById(iconId).className = "fa-solid fa-location-crosshairs text-rose-500 text-lg";
                }
            }, 
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 } // Timeout 10 Detik Mutlak
        );
    }
}

let localHtml5QrCode = null;

function switchScannerTab(tab) {
    const tC = document.getElementById('dinas-tab-cam'), tF = document.getElementById('dinas-tab-file');
    const aC = document.getElementById('dinas-area-cam'), aF = document.getElementById('dinas-area-file');

    if (tab === 'cam') {
        tC.className = "flex-1 py-3 text-sm font-semibold border-b-2 border-blue-600 text-blue-600";
        tF.className = "flex-1 py-3 text-sm font-semibold border-b-2 border-transparent text-slate-500";
        aC.classList.remove('hidden'); aF.classList.add('hidden'); action_startCamera();
    } else {
        tF.className = "flex-1 py-3 text-sm font-semibold border-b-2 border-blue-600 text-blue-600";
        tC.className = "flex-1 py-3 text-sm font-semibold border-b-2 border-transparent text-slate-500";
        aF.classList.remove('hidden'); aC.classList.add('hidden');
        if (localHtml5QrCode && localHtml5QrCode.isScanning) { localHtml5QrCode.stop().catch(()=>{}); }
    }
}

function action_openScanner() {
    const m = document.getElementById('dinas-modal'); const mc = document.getElementById('dinas-modal-content');
    m.classList.remove('hidden'); void m.offsetWidth; m.classList.remove('opacity-0'); mc.classList.remove('scale-95');
    if (!localHtml5QrCode) localHtml5QrCode = new Html5Qrcode("dinas-reader");
    switchScannerTab('cam');
}

function action_startCamera() {
    if (!localHtml5QrCode || localHtml5QrCode.isScanning) return;
    Html5Qrcode.getCameras().then(devices => {
        if (devices && devices.length) {
            let cameraId = devices[0].id; 
            for (let i = 0; i < devices.length; i++) {
                if (devices[i].label.toLowerCase().includes("back") || devices[i].label.toLowerCase().includes("belakang")) { cameraId = devices[i].id; break; }
            }
            localHtml5QrCode.start(cameraId, { fps: 10, qrbox: { width: Math.min(250, window.innerWidth - 80), height: Math.min(250, window.innerWidth - 80) } }, processScanResult, () => {}).catch(() => { switchScannerTab('file'); });
        } else { switchScannerTab('file'); }
    }).catch(() => { switchScannerTab('file'); });
}

function action_processImageFile(e) {
    if (e.target.files.length == 0) return;
    if (!localHtml5QrCode) localHtml5QrCode = new Html5Qrcode("dinas-reader");
    sysShowToast("Memproses gambar...", "info");
    localHtml5QrCode.scanFile(e.target.files[0], true)
        .then(decodedText => { processScanResult(decodedText); })
        .catch(() => { sysShowToast("Barcode tidak ditemukan.", "error"); });
    e.target.value = ""; 
}

function processScanResult(decodedText) {
    if (decodedText === "POS-SECURITY-FSET-01") {
        action_closeScanner(); SysState.dinas.isBarcodeValid = true;
        const txtBarcode = document.getElementById('dinas-txt-barcode');
        if (txtBarcode) {
            txtBarcode.className = "text-sm text-emerald-600 font-bold mt-2 mb-4";
            txtBarcode.innerHTML = '<i class="fa-solid fa-check-circle"></i> Barcode Valid (POS-SECURITY-FSET-01)';
        }
        // [UPDATE] Cek trigger berdasarkan mode aktif (Pulang atau Berangkat)
        if (SysState.dinas.isActive) checkEligibility_Pulang(); 
        else checkEligibility_Berangkat();
        
        sysShowToast("Barcode Diterima", "success");
    } else { sysShowToast("Barcode Salah!", "error"); }
}

function action_closeScanner() {
    const m = document.getElementById('dinas-modal'); const mc = document.getElementById('dinas-modal-content');
    m.classList.add('opacity-0'); mc.classList.add('scale-95');
    setTimeout(() => { m.classList.add('hidden'); if (localHtml5QrCode && localHtml5QrCode.isScanning) { localHtml5QrCode.stop().catch(()=>{}); } }, 300);
}

function action_submitDinas(e) {
    e.preventDefault();
    if (!SysState.dinas.isLocValid || !SysState.dinas.isBarcodeValid) return;
    const btn = document.getElementById('dinas-btn-submit');
    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Memproses Keberangkatan...'; btn.disabled = true;

    // [UPDATE LOGIKA ST]: Deteksi kosong atau teks menyusul
    let inputST = document.getElementById('dinas-inp-nost').value.trim();
    if (inputST === "" || inputST === "TIDAK ADA NO ST" || inputST === "ST MENYUSUL") {
        inputST = "BELUM ADA NO ST"; // Pastikan string bersih tanpa kutip
    }

    const payload = { 
      noST: inputST, 
      customer: document.getElementById('dinas-inp-cust').value, 
      lokasi: document.getElementById('dinas-inp-lokasi').value, 
      kordinat: SysState.dinas.kordinat,
      statusAbsensi: document.getElementById('dinas-sel-status').value
    };

    google.script.run
        .withSuccessHandler((res) => {
            if(res.status === "success") { 
                sysShowToast("Berangkat! Hati-hati.", "success"); 
                SysState.dinas.isActive = true; 
                SysState.dinas.data = res.data; 
                localStorage.setItem('cepu_dinas_state', JSON.stringify(res.data));
                renderWorkspace_Dinas(); 
            } else { sysShowToast(res.message, "error"); btn.innerHTML = 'Mulai Perjalanan'; btn.disabled = false; }
        })
        // [UX FIX]: Anti Loading Abadi jika koneksi Drop
        .withFailureHandler((err) => {
            sysShowToast("Koneksi terputus! Cek sinyal internet Anda.", "error"); 
            btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Coba Lagi'; 
            btn.disabled = false;
        })
        .api_submitPerjalananDinas(payload, SysState.user);
}


function action_submitPulang() {
    // [UPDATE] Penolakan jika barcode belum discan
    if (!SysState.dinas.isLocValid || !SysState.dinas.isBarcodeValid) return;
    
    const btn = document.getElementById('dinas-btn-pulang');
    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Proses Kepulangan...'; btn.disabled = true;

    // [UPDATE KILLER FIX]: Sertakan statusAbsensi agar Backend tahu apakah 
    // sistem harus melakukan bypass GPS saat absen pulang atau tidak.
    const payload = { 
        idTransaksi: SysState.dinas.data.idTransaksi, 
        kordinatMasuk: SysState.dinas.kordinat,
        statusAbsensi: SysState.dinas.data.statusAbsensi || "H"
    };

    google.script.run
        .withSuccessHandler((res) => {
            if(res.status === "success") { 
                sysShowToast(`Selesai! Durasi: ${res.data.durasi} Jam | UPD: Rp${res.data.nominal}`, "success"); 
                SysState.dinas.isActive = false; SysState.dinas.data = null; SysState.dinas.isBarcodeValid = false;
                localStorage.removeItem('cepu_dinas_state');
                renderWorkspace_Dinas(); 
            } else { sysShowToast(res.message, "error"); btn.innerHTML = 'Absen Selesai (Pulang)'; btn.disabled = false; }
        })
        // [UX FIX]: Anti Loading Abadi
        .withFailureHandler((err) => {
            sysShowToast("Koneksi terputus saat absen pulang!", "error"); 
            btn.innerHTML = '<i class="fa-solid fa-house-chimney"></i> Absen Selesai (Pulang)'; 
            btn.disabled = false;
        })
        .api_submitPulangDinas(payload, SysState.user);
}

// 1. FUNGSI UNTUK FORM KEBERANGKATAN
function buildForm_NewDinas(initData = { statusOptions: [], historyST: [] }) {
    const isSuperAdmin = sysIsSuperAdmin(SysState.user);
    
    const createField = (label, id, placeholder, extProps = {}) => DOM_Engine.create('div', '', {}, [
        DOM_Engine.create('label', 'block text-sm font-semibold text-slate-700 mb-1.5', {}, [label]),
        DOM_Engine.create('input', 'input-premium w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5', { type: 'text', id: id, placeholder: placeholder, required: 'true', ...extProps })
    ]);

    const optElements = initData.statusOptions.map(opt => DOM_Engine.create('option', '', { value: opt.code }, [ `${opt.code} - ${opt.desc}` ]));
    const selStatus = DOM_Engine.create('select', 'input-premium w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 appearance-none', { id: 'dinas-sel-status', required: 'true' }, optElements);
    const groupStatus = DOM_Engine.create('div', 'relative', {}, [
        DOM_Engine.create('label', 'block text-sm font-semibold text-slate-700 mb-1.5', {}, ['Status Kehadiran']),
        selStatus,
        DOM_Engine.create('i', 'fa-solid fa-chevron-down absolute right-4 top-[42px] text-slate-400 pointer-events-none')
    ]);

    const stOptions = initData.historyST.map(h => DOM_Engine.create('option', '', { value: h.noST }));
    const stDataList = DOM_Engine.create('datalist', '', { id: 'list-history-st' }, stOptions);

    // [UPDATE LOGIKA ST MENYUSUL]: Field tidak lagi required, auto-capslock, dan ada teks info.
    const fNoST = DOM_Engine.create('div', '', {}, [
        DOM_Engine.create('label', 'block text-sm font-semibold text-slate-700 mb-1.5', {}, [
            'Nomor ST ', 
            DOM_Engine.create('span', 'text-[11px] text-rose-500 font-bold italic', {}, ['(*Kosongkan/ketik TIDAK ADA NO ST jika menyusul)'])
        ]),
        DOM_Engine.create('input', 'input-premium w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 uppercase', { 
            type: 'text', id: 'dinas-inp-nost', placeholder: 'Masukan NO ST jika ada', list: 'list-history-st', autocomplete: 'off',
            onInput: function(e) {
                this.value = this.value.toUpperCase(); // Auto Capslock Force
                const val = this.value.trim();
                const found = initData.historyST.find(h => h.noST === val);
                if (found) {
                    document.getElementById('dinas-inp-cust').value = found.customer;
                    document.getElementById('dinas-inp-lokasi').value = found.lokasi;
                }
            }
        }),
        stDataList

    const fCust = createField('Nama Customer', 'dinas-inp-cust', 'Nama Customer tanpa PT (Contoh: SAT)', {
        onInput: function() { this.value = this.value.toUpperCase(); },
        onBlur: function() {
            let val = this.value.trim();
            if (val.length > 0 && !val.startsWith('PT. ')) { this.value = 'PT. ' + val.replace(/^PT\.?\s*/i, ''); }
        }
    });

    const fLokasi = createField('Area / Lokasi', 'dinas-inp-lokasi', 'Contoh: Cikarang', {
        onInput: function() { this.value = this.value.toUpperCase(); }

    const scanStatus = DOM_Engine.create('p', 'text-xs text-red-500 mt-2 font-medium', {id: 'dinas-txt-barcode'}, ['*Wajib scan barcode pos (POS-SECURITY-FSET-01)']);

function action_submitDinas_Sales(e) {
    e.preventDefault();
    if (!SysState.dinas.isLocValid || !SysState.dinas.isBarcodeValid) return;
    
    // [UPDATE] Validasi Manual Ekstra untuk VC dan ST
    const statusTerpilih = document.getElementById('sales-sel-status').value;
    let customerValue = "-";
    let lokasiValue = "-";

    if (statusTerpilih === 'VC' || statusTerpilih === 'ST') {
        customerValue = document.getElementById('sales-inp-cust').value.trim();
        lokasiValue = document.getElementById('sales-inp-lokasi').value.trim();
        if (customerValue === "" || lokasiValue === "") {
            sysShowToast("Peringatan: Nama Customer dan Lokasi wajib diisi untuk status VC/ST!", "error");
            return; // Blokir jika kosong
        }
    }

    const btn = document.getElementById('dinas-btn-submit');
    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Memproses Absensi...'; btn.disabled = true;

    const payload = { 
      noST: "SALES-ABSENSI", 
      customer: customerValue, 
      lokasi: lokasiValue, 
      kordinat: SysState.dinas.kordinat,
      statusAbsensi: statusTerpilih 
    };

    google.script.run
        .withSuccessHandler((res) => {
            if(res.status === "success") { 
                sysShowToast("Absensi Sales Berhasil Tercatat!", "success"); 
                SysState.dinas.isActive = true; 
                SysState.dinas.data = res.data; 
                localStorage.setItem('cepu_dinas_state', JSON.stringify(res.data));
                renderWorkspace_Dinas(); 
            } else { sysShowToast(res.message, "error"); btn.innerHTML = 'Mulai Absensi Sales'; btn.disabled = false; }
        })
        // [UX FIX]: Anti Loading Abadi jika koneksi Drop
        .withFailureHandler((err) => {
            sysShowToast("Koneksi terputus! Cek sinyal internet Anda.", "error"); 
            btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Coba Lagi'; 
            btn.disabled = false;
        })
        .api_submitPerjalananDinas(payload, SysState.user);
}

function action_loadMasterTable(sheetName) {
    DOM_Engine.clear('nav-workspace');
    const container = document.getElementById('nav-workspace');
    
    container.appendChild(DOM_Engine.create('div', 'flex flex-col items-center justify-center py-20 fade-in', {}, [
        DOM_Engine.create('i', 'fa-solid fa-circle-notch fa-spin text-4xl text-amber-500 mb-4'),
        DOM_Engine.create('p', 'text-slate-500 font-medium tracking-wide', {}, [`Menarik data dari ${sheetName}...`])
    ]));

    google.script.run.withSuccessHandler((res) => {
        if (res.status === 'success') {
            renderWorkspace_MasterTable(sheetName, res.data.headers, res.data.rows);
        } else {

function showModal_MasterCRUD(sheetName, headers, rowData, rowIndex, allRows) {
    const isEdit = rowData !== null;
    const safeRowIndex = isEdit ? rowIndex : -1; 

    function getUniqueOptions(colIndex) {
        const options = new Set();
        if (allRows) {
            allRows.forEach(r => {
                let val = r[colIndex];
                if (val !== undefined && val !== null && val.toString().trim() !== "") {
                    options.add(val.toString().trim().toUpperCase());
                }
            });
        }
        return Array.from(options).sort();
    }

    const inputs = headers.map((h, i) => {
        let val = isEdit ? rowData[i] : '';
        let inputEl;
        let dataListEl = null;
        const hUpper = h.toUpperCase();
        
        // [UPDATE MULTI-ROUTING]: Cek apakah ini kolom Dropdown untuk Karyawan atau Latlong
        const isKaryawanDropdown = sheetName === 'Master_Karyawan' && ['JABATAN', 'GOLONGAN', 'STATUS_KARYAWAN', 'DEPARTEMEN', 'LOKASI'].includes(hUpper);
        const isLatlongDropdown = sheetName === 'Master_Latlong' && ['LOKASI', 'STATUS_LATLONG'].includes(hUpper);
        
        if (isKaryawanDropdown || isLatlongDropdown) {
            let uniqueOptions = getUniqueOptions(i);
            
            // [KILLER FEATURE]: Injeksi Opsi Kaku untuk STATUS_LATLONG
            if (hUpper === 'STATUS_LATLONG') {
                uniqueOptions = ['AKTIF', 'NON AKTIF'];
            }

            const listId = `list-${sheetName}-${hUpper}-${i}`; 
            
            const optElements = uniqueOptions.map(opt => DOM_Engine.create('option', '', { value: opt }));
            dataListEl = DOM_Engine.create('datalist', '', { id: listId }, optElements);

            inputEl = DOM_Engine.create('input', 'input-premium w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-800 font-bold', { 
                type: 'text', value: val, 'data-crud-field': i, placeholder: `Pilih atau ketik ${h}...`, 
                required: 'true', list: listId, autocomplete: 'off',
                onInput: function() { this.value = this.value.toUpperCase(); } 
            });
        } else {
            // Field lainnya (seperti LAT, LONG, RADIUS MAX) akan menggunakan Text Input biasa
            inputEl = DOM_Engine.create('input', 'input-premium w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-800 font-medium', { 
                type: 'text', value: val, 'data-crud-field': i, placeholder: `Isi ${h}...`, required: 'true' 
            });
        }

        const wrapperChildren = [ DOM_Engine.create('label', 'block text-xs font-bold text-slate-600 mb-1.5 uppercase tracking-wide', {}, [h]), inputEl ];
        if (dataListEl) wrapperChildren.push(dataListEl);
        return DOM_Engine.create('div', '', {}, wrapperChildren);
    });

    const formId = 'form-crud-master-data';

    const btnCancel = DOM_Engine.create('button', 'w-full sm:w-auto px-5 py-2.5 text-sm font-bold text-slate-500 hover:bg-slate-100 rounded-xl transition-colors', { type: 'button', onClick: () => document.getElementById('crud-modal').remove() }, ['Batal']);
    
    const btnSave = DOM_Engine.create('button', 'w-full sm:w-auto px-5 py-2.5 text-sm font-bold text-white bg-amber-500 hover:bg-amber-600 rounded-xl shadow-md flex items-center justify-center gap-2 transition-all hover:-translate-y-0.5', { 
        type: 'submit', id: 'btn-crud-save', form: formId 
    }, [DOM_Engine.create('i', 'fa-solid fa-cloud-arrow-up'), isEdit ? 'Simpan Perubahan' : 'Rekam Entitas Baru']);

    const form = DOM_Engine.create('form', 'space-y-4 max-h-[60vh] overflow-y-auto px-6 py-6 hide-scrollbar', { 
        id: formId, 
        onSubmit: (e) => {
            e.preventDefault();
            const payload = [];
            for (let i = 0; i < headers.length; i++) {
                const field = document.querySelector(`[data-crud-field="${i}"]`);
                payload.push(field ? field.value.trim() : "");
            }
            
            if (payload[0] === "") {
                sysShowToast("Gagal: Kolom pertama tidak boleh kosong!", "error");
                return;
            }

            action_saveMasterRow(sheetName, isEdit ? "UPDATE" : "CREATE", payload, safeRowIndex);
        }
    }, [...inputs]);

    const modalContent = DOM_Engine.create('div', 'bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden border border-slate-100', {}, [
        DOM_Engine.create('div', 'p-5 border-b border-slate-100 flex justify-between bg-slate-50/50', {}, [
            DOM_Engine.create('h3', 'font-extrabold text-slate-800 text-lg', {}, [isEdit ? 'Ubah Data' : 'Tambah Entitas Baru']),
            DOM_Engine.create('button', 'text-slate-400 hover:text-red-500', { type: 'button', onClick: () => document.getElementById('crud-modal').remove() }, [DOM_Engine.create('i', 'fa-solid fa-times text-lg')])
        ]),
        form, 
        DOM_Engine.create('div', 'p-5 border-t bg-slate-50 flex flex-col sm:flex-row justify-end gap-3', {}, [btnCancel, btnSave]) 
    ]);

    document.body.appendChild(DOM_Engine.create('div', 'fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[110] flex items-center justify-center p-4', { id: 'crud-modal' }, [modalContent]));
}

function action_saveMasterRow(sheetName, actionStr, payload, rowIndex) {
    const btn = document.getElementById('btn-crud-save');
    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Menyinkronisasi...';
    btn.disabled = true;

    console.log(`[DEBUG FRONTEND] 4. Menghubungi Server API... Action: ${actionStr}`);

    google.script.run
        .withSuccessHandler((res) => {
            console.log("[DEBUG FRONTEND] 5. Respon Sukses dari Server:", res);
            if (res.status === 'success') {
                sysShowToast(res.message, 'success');
                document.getElementById('crud-modal').remove();
                action_loadMasterTable(sheetName); 
            } else {
                sysShowToast("Error Server: " + res.message, 'error');
                btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Coba Lagi';
                btn.disabled = false;
            }
        })
        // [UPDATE DEBUG FIX]: Menangkap jika Backend Crash Total!
        .withFailureHandler((err) => {
            console.error("[DEBUG FRONTEND] 💥 SERVER CRASH:", err);
            sysShowToast("CRITICAL ERROR: Cek Console Browser (F12)!", 'error');
            btn.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Gagal Sistem';
            btn.disabled = false;
        })
        .api_adminMutateMaster(actionStr, sheetName, payload, rowIndex);
}

/** * [NEW ENGINE]: Handle Direct Download PDF via Base64
 */
function sysExportOpsPDF() {
    sysShowToast('Membangun dokumen PDF secara langsung... Mohon tunggu', 'info');
    
    google.script.run
        .withSuccessHandler(res => {
            if (!res || res.status === 'error') {
                const errMsg = res ? res.message : 'Koneksi Server Terputus';
                return sysShowToast('Gagal: ' + errMsg, 'error');
            }
            
            // Konversi Base64 string kembali menjadi Array Bytes
            const byteCharacters = atob(res.base64);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);
            
            // Rakit menjadi File PDF di browser
            const blob = new Blob([byteArray], {type: 'application/pdf'});
            
            // Buat elemen link tersembunyi untuk auto-download
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.download = res.filename; // Nama file di set oleh server
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            sysShowToast('Laporan PDF berhasil diunduh ke perangkat Anda!', 'success');
        })
        .api_exportOperationalPDF(State_OpsFilters); 
}

// ==========================================================
// [HELPER UTILITY ENGINE] - INTERACTIVE TREND LINE CHART
// ==========================================================
function _uiCreateOpsTrendLine(trendData) {
    if (!trendData || trendData.length < 2) {
        return DOM_Engine.create('div', 'py-10 text-center text-slate-400 font-bold border-2 border-dashed border-slate-100 rounded-[2.5rem]', {}, [
            DOM_Engine.create('i', 'fa-solid fa-chart-line mb-2 block text-2xl opacity-20'),
            'Data tren harian belum tersedia.'
        ]);
    }

    const svgNS = "http://www.w3.org/2000/svg";
    const maxVal = Math.max(...trendData.map(t => t.trip), 1);
    
    // Dimensi Kanvas SVG
    const width = 1000; 
    const height = 200;
    const paddingX = 40;
    const paddingY = 40;

    // 1. TOOLTIP ENGINE (DOM Melayang yang disembunyikan secara default)
    let tooltip = document.getElementById('ops-chart-tooltip');
    if (!tooltip) {
        tooltip = DOM_Engine.create('div', 'fixed hidden bg-slate-900/95 backdrop-blur-md text-white p-4 rounded-2xl shadow-2xl text-xs z-[999] pointer-events-none border border-white/10 min-w-[160px] transition-opacity duration-200', { id: 'ops-chart-tooltip' });
        document.body.appendChild(tooltip);
    }

    // 2. KALKULASI TITIK KOORDINAT (X, Y)
    const points = trendData.map((t, i) => {
        const x = paddingX + (i / (trendData.length - 1)) * (width - 2 * paddingX);
        const y = (height - paddingY) - (t.trip / maxVal) * (height - 2 * paddingY);
        return { x, y, data: t };
    });

    const polylinePoints = points.map(p => `${p.x},${p.y}`).join(' ');

    // 3. BANGUN SVG BERSERTA GRID BACKGROUND
    const svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
    svg.setAttribute("class", "w-full h-64 overflow-visible select-none mt-4 drop-shadow-sm");

    // Grid Horizontal
    [0, 0.5, 1].forEach(tick => {
        const y = (height - paddingY) - (tick * (height - 2 * paddingY));
        const line = document.createElementNS(svgNS, "line");
        line.setAttribute("x1", paddingX); line.setAttribute("y1", y);
        line.setAttribute("x2", width - paddingX); line.setAttribute("y2", y);
        line.setAttribute("stroke", "#f1f5f9"); // Garis abu-abu super tipis
        line.setAttribute("stroke-width", "1");
        svg.appendChild(line);
    });

    // Garis Utama (Trend Line)
    const line = document.createElementNS(svgNS, "polyline");
    line.setAttribute("fill", "none");
    line.setAttribute("stroke", "#6366f1"); // Indigo Tailwind
    line.setAttribute("stroke-width", "4");
    line.setAttribute("stroke-linecap", "round");
    line.setAttribute("stroke-linejoin", "round");
    line.setAttribute("points", polylinePoints);
    line.setAttribute("class", "drop-shadow-lg");
    svg.appendChild(line);

    // 4. INJEKSI MARKERS (Titik Interaktif) & SUMBU X
    points.forEach((p, i) => {
        // Lingkaran Penanda (Dot)
        const circle = document.createElementNS(svgNS, "circle");
        circle.setAttribute("cx", p.x);
        circle.setAttribute("cy", p.y);
        circle.setAttribute("r", "5");
        circle.setAttribute("fill", "white");
        circle.setAttribute("stroke", "#6366f1");
        circle.setAttribute("stroke-width", "3");
        circle.setAttribute("class", "cursor-pointer transition-all duration-300 hover:r-8 hover:fill-amber-400 hover:stroke-amber-400");

        // EVENT HOVER (Tampilkan Tooltip saat disentuh)
        circle.addEventListener('mouseenter', (e) => {
            DOM_Engine.clear('ops-chart-tooltip');
            
            // Format Tanggal untuk Tooltip (YYYY-MM-DD -> DD/MM/YYYY)
            const dp = p.data.label.split('-');
            const displayDate = dp.length === 3 ? `${dp[2]}/${dp[1]}/${dp[0]}` : p.data.label;

            // Konten Tooltip Melayang
            tooltip.appendChild(DOM_Engine.create('div', 'font-black text-amber-400 mb-3 border-b border-white/10 pb-2 text-center tracking-widest', {}, [displayDate]));
            tooltip.appendChild(DOM_Engine.create('div', 'flex justify-between items-center gap-6 mb-2', {}, [
                DOM_Engine.create('span', 'text-[10px] font-bold text-white/60 uppercase', {}, ['Total Trip:']),
                DOM_Engine.create('span', 'font-black text-white text-sm', {}, [`${p.data.trip}`])
            ]));
            tooltip.appendChild(DOM_Engine.create('div', 'flex justify-between items-center gap-6', {}, [
                DOM_Engine.create('span', 'text-[10px] font-bold text-white/60 uppercase', {}, ['Beban UPD:']),
                DOM_Engine.create('span', 'font-black text-emerald-400 text-sm', {}, [`Rp ${Number(p.data.upd).toLocaleString('id-ID')}`])
            ]));
            
            tooltip.classList.remove('hidden');
            
            // Kalkulasi Posisi Mouse agar Tooltip selalu mengikuti dengan presisi
            const rect = e.target.getBoundingClientRect();
            tooltip.style.left = (rect.left - 80) + 'px'; // Geser ke tengah titik
            tooltip.style.top = (rect.top - 120) + 'px'; // Muncul di atas titik
        });

        // Sembunyikan Tooltip saat kursor menjauh
        circle.addEventListener('mouseleave', () => {
            tooltip.classList.add('hidden');
        });

        svg.appendChild(circle);

        // Cetak Label Sumbu X (Tanggal di Bawah)
        // Dibatasi agar tidak saling bertumpuk jika datanya banyak (30 hari)
        if (i % Math.ceil(trendData.length / 8) === 0 || i === trendData.length - 1) {
            const text = document.createElementNS(svgNS, "text");
            text.setAttribute("x", p.x);
            text.setAttribute("y", height - 5); 
            text.setAttribute("text-anchor", "middle");
            text.setAttribute("fill", "#94a3b8"); // Slate-400
            text.setAttribute("font-size", "10");
            text.setAttribute("font-weight", "bold");
            
            const dp = p.data.label.split('-');
            text.textContent = dp.length === 3 ? `${dp[2]}/${dp[1]}` : p.data.label; // Format: DD/MM
            svg.appendChild(text);
        }
    });

    // Bungkus dengan overflow-x-auto agar aman jika dibuka di HP
    return DOM_Engine.create('div', 'w-full overflow-x-auto hide-scrollbar', {}, [
        DOM_Engine.create('div', '', {}, [svg])
    ]);
}

function execute_resetDevice(nrpp) {
    const btn = document.getElementById(`btn-reset-${nrpp}`);
    if(btn) { btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Mereset...'; btn.disabled = true; }

    google.script.run.withSuccessHandler((res) => {
        if(res.status === 'success') {
            sysShowToast(res.message, 'success');
            action_openSubMenu_UnlockDevice(); // Refresh Data UI
        } else { 
            sysShowToast(res.message, 'error'); 
            if(btn) { btn.innerHTML = '<i class="fa-solid fa-mobile-screen-button"></i> Reset Device (Unlock)'; btn.disabled = false; }
        }
    }).api_adminResetDevice(nrpp);
}

function buildUI_ApprovalDashboard(logs) {
    DOM_Engine.clear('nav-workspace');
    const container = document.getElementById('nav-workspace');

    const headerSec = DOM_Engine.create('div', 'mb-6 fade-in flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4', {}, [
        DOM_Engine.create('div', '', {}, [
            DOM_Engine.create('h2', 'text-3xl font-extrabold text-slate-900 tracking-tight flex items-center gap-3', {}, [
                DOM_Engine.create('div', 'p-2 bg-amber-100 rounded-xl', {}, [DOM_Engine.create('i', 'fa-solid fa-file-signature text-amber-600')]),
                'Anomali & Approval'
            ]),
            DOM_Engine.create('p', 'text-slate-500 text-sm mt-2 ml-14', {}, ['Tinjau log perjalanan, sidang HRD, dan kelola gembok cetak.'])
        ]),
        DOM_Engine.create('button', 'bg-white hover:bg-slate-50 text-slate-600 border border-slate-200 px-4 py-2 rounded-xl font-bold text-sm shadow-sm flex items-center gap-2 transition-all', { onClick: renderWorkspace_Approval }, [DOM_Engine.create('i', 'fa-solid fa-rotate-right'), 'Refresh Data'])
    ]);

    if (logs.length === 0) {
        container.appendChild(DOM_Engine.create('div', 'bg-aurora min-h-screen p-2', {}, [headerSec, DOM_Engine.create('div', 'glass text-center py-16 rounded-[2rem] border border-white fade-in', {}, [
            DOM_Engine.create('i', 'fa-solid fa-check-double text-5xl text-emerald-400 mb-4'),
            DOM_Engine.create('h3', 'text-lg font-bold text-slate-500', {}, ['Semua bersih! Tidak ada antrean Approval.'])
        ])]));
        return;
    }

    const monthKey = (log) => {
        if (log.rawKeluar) return log.rawKeluar.slice(0, 7);
        const m = String(log.waktuKeluar || '').match(/(\d{2})\/(\d{4})/);
        return m ? m[2] + '-' + m[1] : '';
    };
    const bulanNames = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    const currentMonth = new Date().getFullYear() + '-' + String(new Date().getMonth() + 1).padStart(2, '0');
    const monthSet = new Set();
    logs.forEach(l => { const k = monthKey(l); if (k) monthSet.add(k); });
    if (!monthSet.has(currentMonth)) monthSet.add(currentMonth);
    const monthOpts = Array.from(monthSet).sort().reverse().map(k => {
        const [y, m] = k.split('-');
        const attrs = { value: k };
        if (k === currentMonth) attrs.selected = 'true';
        return DOM_Engine.create('option', '', attrs, [bulanNames[parseInt(m, 10) - 1] + ' ' + y]);
    });

    // --- NEW BULK ACTION BAR (WITH UNLOCK FEATURE) ---
    const bulkActionBar = DOM_Engine.create('div', 'bg-white border border-indigo-100 p-4 rounded-2xl mb-6 flex flex-col md:flex-row justify-between items-center gap-4 shadow-sm fade-in-up', {}, [
        DOM_Engine.create('div', 'flex items-center gap-3', {}, [
            DOM_Engine.create('div', 'w-10 h-10 bg-indigo-50 text-indigo-500 rounded-lg flex items-center justify-center text-lg', {}, [DOM_Engine.create('i', 'fa-solid fa-layer-group')]),
            DOM_Engine.create('span', 'font-bold text-indigo-600', {id: 'txt-selected-count'}, ['0 Dokumen Terpilih'])
        ]),
        DOM_Engine.create('div', 'flex gap-3 w-full md:w-auto', {}, [
            // Tombol Bulk Unlock (Gembok)
            DOM_Engine.create('button', 'flex-1 md:flex-none px-5 py-2.5 bg-white border border-indigo-200 text-indigo-600 text-sm font-bold rounded-xl shadow-sm hover:bg-indigo-50 transition-colors flex items-center justify-center gap-2 opacity-50 cursor-not-allowed', { 
                id: 'btn-bulk-unlock', disabled: true, onClick: action_executeBulkUnlockPrint 
            }, [DOM_Engine.create('i', 'fa-solid fa-lock-open'), 'Buka Gembok Terpilih']),
            
            // Tombol Bulk Approve
            DOM_Engine.create('button', 'flex-1 md:flex-none px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold rounded-xl shadow-md transition-colors flex items-center justify-center gap-2 opacity-50 cursor-not-allowed', { 
                id: 'btn-bulk-approve', disabled: true, onClick: action_executeBulkApprove 
            }, [DOM_Engine.create('i', 'fa-solid fa-check-double'), 'Approve Terpilih'])
        ])
    ]);

    const toggleCheckbox = (idTransaksi, checked) => {
        if (checked) State_BulkApproval.push(idTransaksi);
        else State_BulkApproval = State_BulkApproval.filter(id => id !== idTransaksi);
        const count = State_BulkApproval.length;
        document.getElementById('txt-selected-count').innerText = `${count} Dokumen Terpilih`;
        
        const btnApp = document.getElementById('btn-bulk-approve');
        const btnUnl = document.getElementById('btn-bulk-unlock');
        
        if (count > 0) { 
            [btnApp, btnUnl].forEach(b => {
                b.disabled = false; b.classList.remove('opacity-50', 'cursor-not-allowed');
            });
        } else {
            [btnApp, btnUnl].forEach(b => {
                b.disabled = true; b.classList.add('opacity-50', 'cursor-not-allowed');
            });
        }
    };

    // [UPDATE UX]: Smart Check-All yang menghormati baris yang sedang difilter (terlihat)
    const toggleCheckAll = (checked) => {
        State_BulkApproval = [];
        document.querySelectorAll('.approval-row-item').forEach(row => {
            const chk = row.querySelector('.chk-approve-item');
            if (chk) {
                // Hanya centang jika baris TIDAK sedang disembunyikan oleh filter
                if (row.style.display !== 'none') {
                    chk.checked = checked;
                    if (checked) State_BulkApproval.push(chk.value);
                } else {
                    chk.checked = false; 
                }
            }
        });
        toggleCheckbox(null, false); // Panggil untuk update teks counter
    };

    // [IN-MEMORY DOM FILTER ENGINE]
    const executeFilter = () => {
        const searchTerm = document.getElementById('filter-search-approval').value.toLowerCase();
        const statusFilter = document.getElementById('filter-status-approval').value;
        const bulanFilter = document.getElementById('filter-bulan-approval').value;
        let visibleCount = 0;
        
        document.querySelectorAll('.approval-row-item').forEach(row => {
            const txt = row.getAttribute('data-search');
            const stat = row.getAttribute('data-status');
            const bln = row.getAttribute('data-bulan');
            
            const matchSearch = txt.includes(searchTerm);
            const matchStatus = (statusFilter === 'ALL') || (stat === statusFilter);
            const matchBulan = (bulanFilter === 'ALL') || (bln === bulanFilter);
            
            if (matchSearch && matchStatus && matchBulan) {
                row.style.display = '';
                visibleCount++;
            } else {
                row.style.display = 'none';
                const chk = row.querySelector('.chk-approve-item');
                if (chk && chk.checked) {
                    chk.checked = false;
                    toggleCheckbox(chk.value, false);
                }
            }
        });
        
        const mainChk = document.getElementById('chk-all-approval');
        if(mainChk) mainChk.checked = false;

        const tableEmpty = document.getElementById('filter-empty-approval-table');
        const mobileEmpty = document.getElementById('filter-empty-approval-mobile');
        if (visibleCount === 0) {
            if (tableEmpty) tableEmpty.style.display = '';
            if (mobileEmpty) mobileEmpty.style.display = '';
        } else {
            if (tableEmpty) tableEmpty.style.display = 'none';
            if (mobileEmpty) mobileEmpty.style.display = 'none';
        }
    };

    // [UI BUILDER]: Enterprise Filter Bar
    const filterBar = DOM_Engine.create('div', 'bg-white border border-slate-200 p-4 rounded-2xl mb-4 flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4 shadow-sm fade-in-up', {}, [
        DOM_Engine.create('div', 'flex items-center gap-3 w-full xl:w-auto bg-slate-50 px-4 py-2.5 rounded-xl border border-slate-200 focus-within:border-indigo-400 focus-within:ring-2 focus-within:ring-indigo-100 transition-all', {}, [
            DOM_Engine.create('i', 'fa-solid fa-magnifying-glass text-slate-400'),
            DOM_Engine.create('input', 'bg-transparent border-none outline-none text-sm font-semibold text-slate-700 w-full md:w-64 placeholder-slate-400', {
                id: 'filter-search-approval', type: 'text', placeholder: 'Cari Personel, NRPP, atau Customer...',
                onInput: executeFilter
            })
        ]),
        DOM_Engine.create('div', 'flex flex-col md:flex-row items-start md:items-center gap-3 w-full xl:w-auto', {}, [
            DOM_Engine.create('div', 'flex items-center gap-3 w-full md:w-auto', {}, [
                DOM_Engine.create('label', 'text-xs font-bold text-slate-500 uppercase tracking-wider whitespace-nowrap', {}, ['Filter Bulan:']),
                DOM_Engine.create('select', 'input-premium bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-bold text-slate-700 outline-none cursor-pointer w-full md:w-auto', {
                    id: 'filter-bulan-approval', onChange: executeFilter
                }, [
                    DOM_Engine.create('option', '', { value: 'ALL' }, ['Semua Bulan']),
                    ...monthOpts
                ])
            ]),
            DOM_Engine.create('div', 'flex items-center gap-3 w-full md:w-auto', {}, [
                DOM_Engine.create('label', 'text-xs font-bold text-slate-500 uppercase tracking-wider whitespace-nowrap', {}, ['Kategori Status:']),
                DOM_Engine.create('select', 'input-premium bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-bold text-slate-700 outline-none cursor-pointer w-full md:w-auto', {
                    id: 'filter-status-approval', onChange: executeFilter
                }, [
                    DOM_Engine.create('option', '', { value: 'ALL' }, ['Semua Dokumen']),
                    DOM_Engine.create('option', '', { value: 'pending' }, ['Menunggu Approval']),
                    DOM_Engine.create('option', '', { value: 'anomali' }, ['Anomali / Sidang']),
                    DOM_Engine.create('option', '', { value: 'terkunci' }, ['Terkunci (Belum Print)'])
                ])
            ])
        ])
    ]);

    const trs = logs.map(log => {
        let jamMasukUI, statusUI, rowBg = 'hover:bg-slate-50/50';
        let rowStatusType = 'pending';

        if (log.isAnomali) {
            rowBg = 'bg-rose-50/30 hover:bg-rose-50';

        } else {

            jamMasukUI = DOM_Engine.create('span', 'text-sm font-bold text-slate-700', {}, [log.waktuMasuk, ' WIB']);

function action_executeSidangEdit(log, outVal, inVal) {
    const btn = document.getElementById('btn-sidang-save');
    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Menghitung...'; btn.disabled = true;

    const payload = {
        idTransaksi: log.idTransaksi, sheetName: log.sheetName,
        nrpp: log.nrpp, jabatan: log.jabatan, golongan: log.golongan,
        wKeluar: outVal, wMasuk: inVal
    };

    google.script.run.withSuccessHandler((res) => {
        if(res.status === 'success') {
            sysShowToast(res.message, 'success');
            document.getElementById('modal-edit-sidang').remove();
            renderWorkspace_Approval(); 
        } else {
            sysShowToast(res.message, 'error');
            btn.innerHTML = '<i class="fa-solid fa-calculator"></i> Kalkulasi Ulang & Simpan'; btn.disabled = false;
        }
    }).api_adminEditLog(payload);
}

function action_executeUnlockPrint(custName, idTrx, nrpp) {
    // Karena tabel Approval menarik data mentah, kita perlu mencari Nomor ST dari context atau idTrx.
    // Untuk keamanan, kita minta konfirmasi HRD.
    const confirmUnlock = confirm(`Buka gembok cetak untuk perjalanan ke ${custName}?`);
    if (!confirmUnlock) return;

    sysShowToast("Menghubungi Server untuk Protokol Unlock...", "info");
    
    // Kita butuh ST Number. Di log backend tadi kita sudah melempar NoST di kolom 8 (Index 8).
    // Mari kita asumsikan log.customer di tabel HRD membawa info ST atau kita tarik via API.
    // Untuk tahap ini, kita gunakan idTransaksi sebagai referensi di Backend.
    
    google.script.run.withSuccessHandler((res) => {
        if(res.status === 'success') {
            sysShowToast(res.message, "success");
            renderWorkspace_Approval(); // Refresh tabel HRD
        } else sysShowToast(res.message, "error");
    }).api_adminUnlockPrintByTRX(idTrx); // Kita buatkan API versi TRX agar lebih spesifik
}

function action_fetchAndExport(sheetName) {
    const btn = document.getElementById(`btn-export-${sheetName}`);
    const originalContent = btn.innerHTML;
    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Menarik Data...';
    btn.disabled = true;

    google.script.run
        .withSuccessHandler((res) => {
            if (res.status === 'success') {
                sysShowToast("Data ditarik. Menyiapkan format Excel...", "info");
                action_exportExcel(res.sheetName, res.data, btn, originalContent);
            } else {
                sysShowToast(res.message, 'error');

function action_exportExcel(sheetName, dataMatrix, btnElement, originalHtml) {
    if (typeof XLSX === "undefined") {
        const script = document.createElement("script");
        script.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
        script.onload = () => executeExcelExport(sheetName, dataMatrix, btnElement, originalHtml);
        document.head.appendChild(script);
    } else { 
        executeExcelExport(sheetName, dataMatrix, btnElement, originalHtml); 
    }
}

function executeExcelExport(sheetName, dataMatrix, btnElement, originalHtml) {
    try {
        // 1. Membuat Workbook dan Worksheet virtual dari Data Matriks Backend
        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.aoa_to_sheet(dataMatrix);
        XLSX.utils.book_append_sheet(wb, ws, "Rekap_Payroll");
        
        // 2. Format penamaan file otomatis dengan Timestamp
        const timeStamp = new Date().toISOString().slice(0,10).replace(/-/g,"");
        const fileName = `C_E_P_U_${sheetName}_${timeStamp}.xlsx`;
        
        // 3. Mengunduh file .xlsx
        XLSX.writeFile(wb, fileName);
        sysShowToast(`File Excel ${sheetName} berhasil diunduh!`, "success");
    } catch(e) {
        console.error("Export Error:", e);
        sysShowToast("Gagal melakukan kompilasi Excel.", "error");
    } finally {
        // 4. Mengembalikan status tombol seperti semula
        btnElement.innerHTML = originalHtml;
        btnElement.disabled = false;
    }
}

function renderWorkspace_LogPribadi() {
    // 1. TANGKAP NILAI FILTER SEBELUM LAYAR DIHANCURKAN
    const elBulan = document.getElementById('filter-bulan');
    const elTahun = document.getElementById('filter-tahun');
    
    let now = new Date();
    let valBulan = elBulan ? elBulan.value : String(now.getMonth() + 1).padStart(2, '0');
    let valTahun = elTahun ? elTahun.value : String(now.getFullYear());

    // 2. FORMAT JADI STRING PERIODE (Contoh: "04-2026")
    let targetPeriode = String(valBulan).padStart(2, '0') + "-" + valTahun;

    // 3. BARU TAMPILKAN LOADING SPINNER
    const container = document.getElementById('nav-workspace');
    container.innerHTML = '<div class="flex flex-col items-center justify-center h-64"><i class="fa-solid fa-spinner fa-spin text-4xl text-blue-500 mb-4"></i><p class="font-bold text-slate-600">Sinkronisasi Riwayat...</p></div>';

    google.script.run

            } else {
                container.innerHTML = `<div class="p-10 text-center text-red-500"><b>Error:</b> ${res.message}</div>`;

        .withFailureHandler((err) => {

}

function syncDinasStateFromServer(nextRender) {
    const dS = localStorage.getItem('cepu_dinas_state');
    if (!dS) return nextRender();

    try {
        const cached = JSON.parse(dS);
        google.script.run
            .withSuccessHandler((res) => {
                if (res.status === 'success' && res.data && res.data.activeTrip) {
                    SysState.dinas.isActive = true;
                    SysState.dinas.data = res.data.activeTrip;
                    localStorage.setItem('cepu_dinas_state', JSON.stringify(res.data.activeTrip));
                } else {
                    localStorage.removeItem('cepu_dinas_state');
                    SysState.dinas.isActive = false;
                    SysState.dinas.data = null;
                }
                nextRender();
            })
            .withFailureHandler(() => {
                SysState.dinas.isActive = true;
                SysState.dinas.data = cached;
                nextRender();
            })
            .api_getInitFormData(SysState.user);
    } catch (e) {
        localStorage.removeItem('cepu_dinas_state');
        SysState.dinas.isActive = false;
        SysState.dinas.data = null;
        nextRender();
    }
}

function execute_downloadDeklarasiPDF(stNumber, logs) {
    sysShowToast("Mempersiapkan QR Digital Signature...", "info");

    // =========================================================================
    // [PATCH v1.4.33 - Opsi B]: BE-Side URL Shortener
    // BE memanggil is.gd via UrlFetchApp (bebas CORS) + cache 6 jam.
    // Semua logika PDF dieksekusi di dalam callback successHandler.
    // =========================================================================
    google.script.run
        .withSuccessHandler(function(res) {
            const shortUrl = res.shortUrl;
            console.log("[QR] Source:", res.source, "| URL:", shortUrl);
            _buildAndSaveDeklarasiPDF(stNumber, logs, shortUrl);
        })
        .withFailureHandler(function(err) {
            console.warn("[QR] api_getShortUrl gagal:", err.message, "- pakai full URL");
            const webAppUrl = "https://script.google.com/macros/s/AKfycbycL6s5-tU3dOlMjksN6OzLcbOcjAxQHhndvXLIaplyi12ELWBg3Wy0xzN_dyy23TVT/exec";
            const fallbackUrl = webAppUrl + "?verify_st=" + stNumber + "&nrpp=" + SysState.user.nrpp;
            _buildAndSaveDeklarasiPDF(stNumber, logs, fallbackUrl);
        })
        .api_getShortUrl(stNumber, SysState.user.nrpp);
}

function _buildAndSaveDeklarasiPDF(stNumber, logs, qrPayload) {
    // QR encode qrPayload = is.gd short URL (~20 char) → QR Version 2 (25×25 modul)
    // size=500 → tiap modul QR lebih tebal & jelas saat diprint B&W
    const qrCodeImage = "https://quickchart.io/qr?text=" + encodeURIComponent(qrPayload) + "&size=500&margin=3&level=L&format=png";

    // =========================================================================
    // [BUG FIX]: CHRONOLOGICAL SORTING ENGINE (A -> Z)
    // Mengurutkan ulang array dari Backend agar Berangkat (Awal) dan Kembali (Akhir)
    // tercetak secara proporsional dari atas ke bawah.
    // =========================================================================
    logs.sort((a, b) => {
        const parseDateStr = (str) => {
            if (!str || str === '-') return 0;
            const parts = str.split(' ');
            const dateParts = parts[0].split('/');
            const timeParts = parts[1] ? parts[1].split(':') : ['00', '00'];
            // Konversi "dd/MM/yyyy HH:mm" ke objek Date Time murni
            return new Date(dateParts[2], dateParts[1] - 1, dateParts[0], timeParts[0], timeParts[1]).getTime();
        };
        return parseDateStr(a.waktuKeluar) - parseDateStr(b.waktuKeluar);
    });
    // =========================================================================

    let berangkat = logs.length > 0 ? logs[0].waktuKeluar : '-';
    let kembali = logs.length > 0 ? logs[logs.length-1].waktuMasuk : '-';
    let customer = logs.length > 0 ? logs[0].customer : '-';
    let lokasiDestinasi = logs.length > 0 ? logs[0].lokasi : '-';

    let minTglKeluar = null;
    if (berangkat !== '-') {
        let datePart = berangkat.split(' ')[0].split('/');
        if (datePart.length === 3) {
            minTglKeluar = new Date(parseInt(datePart[2]), parseInt(datePart[1]) - 1, parseInt(datePart[0]));
        }
    }

    const bulanRomawi = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"];
    const tglReferensi = minTglKeluar ? minTglKeluar : new Date(); 
    const blnRomawi_Str = bulanRomawi[tglReferensi.getMonth()];
    const thn_Str = tglReferensi.getFullYear();
    const formatST = (num) => isNaN(num) ? num : String(num).padStart(3, '0');
    
    const formatSTLengkap = `${formatST(stNumber)}/JKT/ST-PS/${blnRomawi_Str}/${thn_Str}`;

    let tripsHtml = '';
    let grandTotal = 0;
    let totalBaris = logs.length;
    let batasBarisTetap = 10;

    const fmt = (num) => (num && num > 0) ? num.toLocaleString('id-ID') : '';
    const namaHariArray = ["MINGGU", "SENIN", "SELASA", "RABU", "KAMIS", "JUMAT", "SABTU"];

    // Looping sekarang akan mengeksekusi data yang sudah diurutkan (A -> Z)
    for (let i = 0; i < totalBaris; i++) {
        let bd = logs[i].breakdown || { upd: 0, makanSiang: 0, makanTotal: 0, lain: 0, total: 0 };
        grandTotal += bd.total;
        
        let tglOnly = '-';
        if (logs[i].waktuKeluar) {
            let dateStr = logs[i].waktuKeluar.split(' ')[0]; 
            let parts = dateStr.split('/');
            if (parts.length === 3) {
                let d = new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
                let namaHari = namaHariArray[d.getDay()]; 
                tglOnly = `${namaHari}, ${dateStr}`; 
            } else {
                tglOnly = dateStr;
            }
        }

        tripsHtml += `
        <tr>
          <td class="text-left">${tglOnly}</td>
          <td class="text-left"></td>
          <td></td>
          <td></td>
          <td class="text-right">${fmt(bd.upd)}</td>
          <td></td>
          <td class="text-right">${fmt(bd.makanSiang)}</td>
          <td></td>
          <td class="text-right">${fmt(bd.makanTotal)}</td>
          <td></td>
          <td class="text-right">${fmt(bd.lain)}</td>
          <td class="text-right" style="font-weight: bold;">${fmt(bd.total)}</td>
        </tr>`;
    }

    for (let j = totalBaris; j < batasBarisTetap; j++) {
        tripsHtml += `<tr><td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`;
    }

    const pdfContainer = document.createElement('div');
    pdfContainer.style.fontFamily = 'Arial, sans-serif';
    pdfContainer.style.fontSize = '8pt';
    pdfContainer.style.color = '#000';
    pdfContainer.style.backgroundColor = '#fff';

    // DI SINI ADALAH TEMPLATE ASLI ANDA 100%. 
    // SAYA HANYA MENYISIPKAN <img src="${qrCodeImage}"> PADA BAGIAN "Disusun oleh" DI PALING BAWAH.

      <style>
        .judul { text-align: center; font-size: 11pt; font-weight: bold; margin-bottom: 5px; margin-top: 0px; color: #000; }
        table { width: 100%; border-collapse: collapse; page-break-inside: avoid; color: #000; }

        .table-data th { text-align: center; font-weight: normal; }
        .table-ttd { width: 80%; margin-top: 8px; font-size: 8pt; page-break-inside: avoid; }
        .table-ttd th, .table-ttd td { border: 1px solid #000; padding: 2px; text-align: center; vertical-align: top; }
        .table-ttd th { font-weight: normal; }
        .text-center { text-align: center; } .text-right { text-align: right; } .text-left { text-align: left; }
      </style>

      <div class="judul">LAPORAN DEKLARASI PERJALANAN DINAS</div>

      <table class="table-kop">

        </tr>

        </tr>
        <tr>

                DOM_Engine.create('select', 'input-premium w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-bold mt-1', { id: 'sel-audit-month' },

// ==========================================================
// RENDER PDF INDIVIDU (PIXEL-PERFECT ENTERPRISE TEMPLATE)
// ==========================================================
function renderPDF_IndividualAudit(user, logs, filter) {
    sysShowToast("Membangun Dokumen Analytics Enterprise (Pure Table Engine)...", "info");
    const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
    const periodeStr = `${months[filter.month]} ${filter.year}`;
    const tglCetak = new Date().toLocaleString('id-ID', { day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' }) + ' WIB';

    // =========================================================================
    // 1. ENTERPRISE ANALYTICS ENGINE (DATA PROCESSING)
    // =========================================================================
    let totalUpd = 0, totalDurasi = 0;
    const groupST = {}, groupCust = {}, dailyIncome = {};

    logs.forEach(l => {
        totalUpd += l.nominal;
        totalDurasi += l.durasi;
        
        if (!groupST[l.st]) groupST[l.st] = { count: 0, durasi: 0, nominal: 0, customers: new Set() };
        groupST[l.st].count++;
        groupST[l.st].durasi += l.durasi;
        groupST[l.st].nominal += l.nominal;
        groupST[l.st].customers.add(l.customer);

        if (!groupCust[l.customer]) groupCust[l.customer] = { count: 0, nominal: 0, durasi: 0 };
        groupCust[l.customer].count++;
        groupCust[l.customer].nominal += l.nominal;
        groupCust[l.customer].durasi += l.durasi;

        let dateKey = l.tanggal.split(' ')[0];
        dailyIncome[dateKey] = (dailyIncome[dateKey] || 0) + l.nominal;
    });

    const avgDurasi = logs.length > 0 ? (totalDurasi / logs.length).toFixed(2) : 0;
    const avgUpd = logs.length > 0 ? (totalUpd / logs.length) : 0;
    const peakDay = Object.entries(dailyIncome).sort((a,b) => b[1] - a[1])[0] || ["-", 0];

    // =========================================================================
    // 2. HTML BUILDER (PAGE 1: LOG PERJALANAN DETAIL)
    // =========================================================================
    const rowsLogHtml = logs.map((l, i) => {
        const bgRow = i % 2 === 0 ? '#ffffff' : '#f8fafc';
        const isApp = l.persetujuan.toUpperCase() === 'APPROVED';
        const isPen = l.persetujuan.toUpperCase().includes('PENDING');
        const stClass = isApp ? 'color:#059669; background:#ecfdf5; border:1px solid #a7f3d0;' : 
                       (isPen ? 'color:#d97706; background:#fffbeb; border:1px solid #fde68a;' : 'color:#e11d48; background:#fff1f2; border:1px solid #fecdd3;');
        
        return `
            <tr style="background:${bgRow};">
                <td class="text-center" style="color:#64748b; font-weight:bold;">${i+1}</td>
                <td style="font-weight:bold; color:#334155;">${l.tanggal}</td>
                <td>
                    <strong style="color:#0f172a; font-size:9pt; display:block;">${l.customer}</strong>
                    <span style="color:#64748b; font-size:7.5pt;">Lokasi: ${l.lokasi} | ST: ${l.st}</span>
                </td>
                <td class="text-center" style="font-weight:bold; color:#475569;">${l.durasi}h</td>
                <td class="text-right" style="font-weight:900; color:#0f172a;">Rp ${l.nominal.toLocaleString('id-ID')}</td>
                <td class="text-center">
                    <span style="padding:4px 8px; border-radius:6px; font-size:7pt; font-weight:900; ${stClass}">${l.persetujuan}</span>
                </td>
            </tr>`;
    }).join('');

    // =========================================================================
    // 3. HTML BUILDER (PAGE 2: ANALISA BERDASARKAN ST)
    // =========================================================================
    const rowsSTHtml = Object.entries(groupST).map((entry, i) => {
        const [stNum, data] = entry;
        const bgRow = i % 2 === 0 ? '#ffffff' : '#f8fafc';
        const custArr = Array.from(data.customers).join(', ');
        return `
            <tr style="background:${bgRow};">
                <td style="font-weight:900; color:#1e40af; font-size:9pt;">${stNum}</td>
                <td style="color:#475569; font-size:8pt; line-height:1.4;">${custArr}</td>
                <td class="text-center" style="font-weight:bold; color:#0f172a;">${data.count} Titik</td>
                <td class="text-center" style="font-weight:bold; color:#475569;">${data.durasi.toFixed(2)}h</td>
                <td class="text-right" style="font-weight:900; color:#059669;">Rp ${data.nominal.toLocaleString('id-ID')}</td>
            </tr>`;
    }).join('');

    // =========================================================================
    // 4. HTML BUILDER (PAGE 3: ADVANCED STATISTICS)
    // =========================================================================
    const rowsCustHtml = Object.entries(groupCust).sort((a,b) => b[1].nominal - a[1].nominal).map((entry, i) => {
        const [cust, data] = entry;
        return `
            <tr>
                <td style="padding:12px 0; border-bottom:1px dashed #cbd5e1; font-weight:bold; color:#334155; font-size:9pt;">${i+1}. ${cust}</td>

    const pdfContent = document.createElement('div');
    pdfContent.style.padding = "40px 50px"; // Format padding aman seperti cetak log

function action_openInputSTModal(stName, logs) {
    const modalId = 'modal-update-st-epicor';

    const btnCancel = DOM_Engine.create('button', 'w-full sm:w-auto px-5 py-2.5 text-sm font-bold text-slate-500 hover:bg-slate-100 rounded-xl transition-colors', { 
        type: 'button', onClick: () => document.getElementById(modalId).remove() 
    }, ['Batal']);

    const btnSave = DOM_Engine.create('button', 'w-full sm:w-auto px-5 py-2.5 text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-md flex items-center justify-center gap-2 transition-all', { 
        type: 'button', id: 'btn-save-new-st',
        onClick: () => {
            const newST = document.getElementById('inp-new-epicor-st').value.trim();
            if(!newST) return sysShowToast("Nomor ST Epicor wajib diisi!", "error");
            
            const checkedBoxes = document.querySelectorAll('.chk-update-st:checked');
            if(checkedBoxes.length === 0) return sysShowToast("Pilih minimal 1 kunjungan yang ingin dimasukkan ke ST ini!", "error");
            
            const trxIds = Array.from(checkedBoxes).map(cb => cb.value);
            execute_updateSTEpicor(trxIds, newST, modalId);
        }
    }, [DOM_Engine.create('i', 'fa-solid fa-cloud-arrow-up'), 'Simpan & Update ST']);

    // List Checkbox Perjalanan
    const logElements = logs.map(l => {
        return DOM_Engine.create('label', 'flex items-center gap-3 p-3 bg-white border border-slate-200 rounded-xl cursor-pointer hover:border-indigo-300 transition-colors shadow-sm mb-2 group', {}, [
            DOM_Engine.create('input', 'chk-update-st w-5 h-5 text-indigo-600 rounded cursor-pointer border-slate-300', { type: 'checkbox', value: l.idTransaksi }),
            DOM_Engine.create('div', 'flex-1', {}, [
                DOM_Engine.create('p', 'text-sm font-bold text-slate-800 leading-tight group-hover:text-indigo-600', {}, [`${l.customer} ${l.lokasi || '-'}`]),
                DOM_Engine.create('p', 'text-[10px] text-slate-500', {}, [`Berangkat: ${l.waktuKeluar} | Durasi: ${l.durasi} Jam`])
            ])
        ]);
    });

    const formEdit = DOM_Engine.create('div', 'px-6 py-4 text-left max-h-[60vh] overflow-y-auto bg-slate-50', {}, [
        DOM_Engine.create('div', 'mb-5', {}, [
            DOM_Engine.create('label', 'block text-xs font-bold text-slate-600 mb-1 uppercase tracking-wider', {}, ['Nomor ST Resmi (Epicor)']),
            DOM_Engine.create('input', 'input-premium w-full bg-white border-indigo-200 px-4 py-3 text-sm font-black uppercase text-indigo-700 shadow-inner', { 
                type: 'text', id: 'inp-new-epicor-st', placeholder: 'Ketik Nomor ST Baru...',
                onInput: function() { this.value = this.value.toUpperCase(); }
            })
        ]),
        DOM_Engine.create('label', 'block text-xs font-bold text-slate-600 mb-2 uppercase tracking-wider', {}, ['Pilih Kunjungan (Centang yang sesuai):']),
        DOM_Engine.create('div', '', {}, logElements)
    ]);

    const modalContent = DOM_Engine.create('div', 'bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden border border-slate-100 text-center relative fade-in-up', {}, [
        DOM_Engine.create('div', 'p-5 border-b border-slate-100 flex justify-between items-center', {}, [
            DOM_Engine.create('h3', 'font-extrabold text-slate-800 text-lg flex items-center gap-2', {}, [DOM_Engine.create('i', 'fa-solid fa-file-pen text-indigo-600'), 'Input No ST Epicor']),
            DOM_Engine.create('button', 'text-slate-400 hover:text-red-500', { type: 'button', onClick: () => document.getElementById(modalId).remove() }, [DOM_Engine.create('i', 'fa-solid fa-times')])
        ]),
        formEdit,
        DOM_Engine.create('div', 'p-5 border-t border-slate-100 bg-white flex flex-col sm:flex-row justify-end gap-3', {}, [btnCancel, btnSave]) 
    ]);

    document.body.appendChild(DOM_Engine.create('div', 'fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[110] flex items-center justify-center p-4 fade-in', { id: modalId }, [modalContent]));
}

function execute_updateSTEpicor(trxIds, newST, modalId) {
    const btn = document.getElementById('btn-save-new-st');
    if(!btn) return;
    
    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Menyinkronkan...'; 
    btn.disabled = true;

    google.script.run
      .withSuccessHandler(res => {
          if(res.status === 'success') {
              if(document.getElementById(modalId)) document.getElementById(modalId).remove();
              sysShowToast(res.message, 'success');
              renderWorkspace_LogPribadi(); // Refresh UI
          } else {
              sysShowToast(res.message, 'error');
              btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Simpan & Update ST'; 
              btn.disabled = false;
          }
      })
      .withFailureHandler(err => {
          // ANTI LOADING ABADI: Menangkap error jaringan atau server crash
          console.error("GAS System Error:", err);
          sysShowToast("System Failure: " + err.message, "error");
          btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Simpan & Update ST'; 
          btn.disabled = false;
      })
      .api_userUpdateST(trxIds, newST, SysState.user);
}

// ==========================================================
// COMPONENT: PURE DOM INFO-SWIPER (GLASSMORPHISM)
// ==========================================================
const CEPU_InfoSwiper = {
    create: function(id, slides) {
        let currentSlide = 0;
        const containerId = `swiper-cont-${id}`;
        const trackId = `swiper-track-${id}`;

        const nextSlide = () => {
            currentSlide = (currentSlide + 1) % slides.length;
            const track = document.getElementById(trackId);
            if (track) track.style.transform = `translateX(-${currentSlide * 100}%)`;
            updateDots();
        };

        const updateDots = () => {
            slides.forEach((_, i) => {
                const dot = document.getElementById(`dot-${id}-${i}`);
                if (dot) dot.className = (i === currentSlide) ? 'w-4 h-1.5 bg-indigo-500 rounded-full transition-all duration-300' : 'w-1.5 h-1.5 bg-slate-300 rounded-full transition-all duration-300';
            });
        };

        // Auto-swipe interval 5 detik
        const interval = setInterval(() => {
            if (document.getElementById(containerId)) { nextSlide(); } else { clearInterval(interval); }
        }, 5000);

        const slideElements = slides.map((s, index) => {
            return DOM_Engine.create('div', 'min-w-full p-5 flex items-start gap-4', {}, [
                DOM_Engine.create('div', 'w-12 h-12 rounded-2xl bg-indigo-100 text-indigo-600 flex items-center justify-center shrink-0 shadow-sm', {}, [
                    DOM_Engine.create('i', `fa-solid ${s.icon} text-xl`)
                ]),
                DOM_Engine.create('div', 'flex-1', {}, [
                    DOM_Engine.create('h4', 'text-sm font-bold text-slate-800 mb-1', {}, [s.title]),
                    DOM_Engine.create('p', 'text-xs text-slate-500 leading-relaxed', {}, [s.content])
                ])
            ]);
        });

        const dots = slides.map((_, i) => DOM_Engine.create('div', i === 0 ? 'w-4 h-1.5 bg-indigo-500 rounded-full' : 'w-1.5 h-1.5 bg-slate-300 rounded-full', { id: `dot-${id}-${i}` }));

        return DOM_Engine.create('div', 'relative overflow-hidden bg-white/70 backdrop-blur-md border border-white rounded-[2rem] shadow-premium mb-6 fade-in group', { id: containerId }, [
            // Close Button
            DOM_Engine.create('button', 'absolute top-3 right-3 z-10 w-8 h-8 flex items-center justify-center rounded-full hover:bg-rose-100 text-slate-400 hover:text-rose-500 transition-all', {
                onClick: () => { clearInterval(interval); document.getElementById(containerId).remove(); }
            }, [DOM_Engine.create('i', 'fa-solid fa-times text-xs')]),
            
            // Sliding Track
            DOM_Engine.create('div', 'flex transition-transform duration-700 ease-in-out', { id: trackId, style: 'transform: translateX(0%);' }, slideElements),
            
            // Dots Navigation
            DOM_Engine.create('div', 'flex justify-center gap-1.5 pb-4', {}, dots)
        ]);
    }
};
